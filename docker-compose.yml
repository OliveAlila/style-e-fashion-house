version: '3.8'

services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  db:
    image: postgres:16-alpine
    container_name: style-fashion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Hackifyoucan254}
      POSTGRES_DB: ${POSTGRES_DB:-style_fashion_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize database with complete schema
      - ./server/migrations/000_init_complete_schema.sql:/docker-entrypoint-initdb.d/000_init_complete_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-style_fashion_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - style-fashion-network

  # =====================================================
  # Backend API Server
  # =====================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: style-fashion-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-Hackifyoucan254}@db:5432/${POSTGRES_DB:-style_fashion_db}
      PGSSL: ${PGSSL:-false}
      
      # Admin Authentication
      ADMIN_TOKEN: ${ADMIN_TOKEN:-your-secure-admin-token-change-me}
      
      # Marketplace Authentication
      MARKETPLACE_AUTH_SECRET: ${MARKETPLACE_AUTH_SECRET:-your-marketplace-auth-secret-at-least-32-chars-long}
      
      # Paystack Payment Gateway
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      
      # Cloudinary Image Uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      
      # Client URL for CORS
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - style-fashion-network

  # =====================================================
  # Optional: pgAdmin for Database Management
  # =====================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: style-fashion-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@stylefashion.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - style-fashion-network
    profiles:
      - tools

# =====================================================
# Networks
# =====================================================
networks:
  style-fashion-network:
    driver: bridge

# =====================================================
# Volumes for Data Persistence
# =====================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
