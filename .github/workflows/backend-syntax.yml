name: Backend syntax checks
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-syntax.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-syntax.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check backend JavaScript syntax
        run: |
          node --check server/index.js
          node --check server/marketplace.js
          node --check server/admin.js
      - name: Install backend dependencies
        run: npm install --prefix server
